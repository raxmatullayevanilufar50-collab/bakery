<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c67c52"/>
      <stop offset="1" stop-color="#5c2d0a"/>
    </linearGradient>
    <linearGradient id="loaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8f0"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
  </defs>

  <!-- background: safe-zone aware for maskable icons -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- bread loaf -->
  <g>
    <path d="M 128 320
             C 128 240, 168 170, 256 170
             C 344 170, 384 240, 384 320
             C 384 355, 356 372, 320 372
             L 192 372
             C 156 372, 128 355, 128 320 Z"
          fill="url(#loaf)" stroke="#8b4513" stroke-width="8" stroke-linejoin="round"/>
    <!-- score marks -->
    <path d="M 196 240 L 176 300" stroke="#8b4513" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 256 226 L 244 300" stroke="#8b4513" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 316 240 L 336 300" stroke="#8b4513" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
</svg>
